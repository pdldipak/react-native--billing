services:
  expo:
    build: .
    ports:
      - "8081:8081"   # Metro
      - "19000:19000" # Expo dev tools
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_NATIVE_PACKAGER_HOSTNAME: host.docker.internal
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: npx expo start --host lan

volumes:
  node_modules: